name: Release

# Tag-driven: the tag is the version number, so nothing here has to be edited to
# cut a release. Tags carry no "v" prefix, because the packager copies the tag
# into the TOC verbatim and "## Version: v0.1.0" is not what an addon list should
# read. Matching every tag rather than a prefix is what lets that work.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  # A tag was able to publish without anything having run the suite. Reusing the
  # test workflow rather than repeating its steps means there is one definition
  # of what passing means, and the release gate cannot drift from the one that
  # runs on every push.
  test:
    uses: ./.github/workflows/tests.yml

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The packager works the version out of the tag and builds the
          # changelog from the commits since the previous one. A shallow clone
          # has neither.
          fetch-depth: 0

      - name: Package and publish
        uses: BigWigsMods/packager@v2
        # No arguments: the addon is the repository root, so the packager finds
        # the TOC beside .git on its own and .pkgmeta says what to leave out.
        env:
          # Creates the GitHub release and attaches the zip.
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # Absent until a CurseForge project exists, and the packager simply
          # skips that upload when it is. That is what makes the first tag a
          # safe dry run: a real zip to inspect, published nowhere.
          #
          # To wire it up: add the token as a repo secret and put the project id
          # in the TOC as "## X-Curse-Project-ID:". This file needs no edit.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
