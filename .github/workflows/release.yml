name: Release

# Tag-driven: the tag is the version number, so nothing here has to be edited to
# cut a release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The packager works the version out of the tag and builds the
          # changelog from the commits since the previous one. A shallow clone
          # has neither.
          fetch-depth: 0

      - name: Package and publish
        uses: BigWigsMods/packager@v2
        with:
          # -t points the packager at the addon folder rather than the repo
          # root, so spec, tools, spike and docs are excluded by never being
          # looked at. No ignore list to fall out of date.
          args: -t SimhammerInspector
        env:
          # Creates the GitHub release and attaches the zip.
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # Absent until a CurseForge project exists, and the packager simply
          # skips that upload when it is. That is what makes the first tag a
          # safe dry run: a real zip to inspect, published nowhere.
          # Wiring it up later takes a repo secret and an
          # "## X-Curse-Project-ID:" line in the TOC. This file stays as is.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
